name: Update orbital data

on:
  schedule:
    # Once a day at 06:17 UTC. Off the hour, because many scheduled jobs
    # start at :00 and GitHub may delay those.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch from CelesTrak
        run: npm run fetch-data
      - name: Check the new data
        run: npm test
      - name: Commit if the element sets changed
        run: |
          # omm.json always changes (its fetchedAt timestamp), so judge by tle.txt,
          # which only changes when CelesTrak publishes new elements.
          if git diff --quiet -- public/data/tle.txt; then
            echo "No new element sets."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          git commit -m "Update orbital data $(date -u +%Y-%m-%d)"
          git push
